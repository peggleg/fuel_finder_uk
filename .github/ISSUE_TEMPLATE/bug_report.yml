name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [Troubleshooting section](https://github.com/peggleg/fuel_finder_uk#troubleshooting) in the README - your issue might already be covered there.

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Settings → Devices & Services → UK Fuel Finder → the version shown there
      placeholder: "1.0.6"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Settings → System → Logs, or enable debug logging first:
        ```yaml
        logger:
          logs:
            custom_components.fuel_finder_uk: debug
        ```
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
    validations:
      required: false
